<template>

    <div class="container">

        <h2 class="title">Job Applications</h2>

        <div class="stats">

            <div class="card total">
                <p>Total Applications</p>
                <h3>{totalCount}</h3>
            </div>

            <div class="card applied">
                <p>Applied</p>
                <h3>{appliedCount}</h3>
            </div>

            <div class="card interviewing">
                <p>Interviewing</p>
                <h3>{interviewingCount}</h3>
            </div>

            <div class="card offered">
                <p>Offered</p>
                <h3>{offeredCount}</h3>
            </div>

            <div class="card rejected">
                <p>Rejected</p>
                <h3>{rejectedCount}</h3>
            </div>

        </div>

        <template for:each={applications} for:item="app">
            <div key={app.Id} class="application-card">

                <div class="left">
                    <p><strong>Name:</strong> {app.Name}</p>
                    <p><strong>Position:</strong> {app.Position__c}</p>
                    <p><strong>Company:</strong> {app.Company__r.Name}</p>
                    <p>
                        <strong>Status:</strong>
                        <span class={app.statusClass}>{app.Status__c}</span>
                    </p>
                    <p><strong>Applied Date:</strong> {app.Applied_Date__c}</p>
                    <p><strong>Interview Date:</strong> {app.Interview_Date__c}</p>
                </div>

                <div class="right">
                    <lightning-button
                        label="Update Status"
                        variant="brand"
                        data-id={app.Id}
                        onclick={openModal}>
                    </lightning-button>
                </div>

            </div>
        </template>

        <template if:true={showModal}>
            <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container">

                    <header class="slds-modal__header">
                        <h2 class="slds-text-heading_medium">Update Status</h2>
                    </header>

                    <div class="slds-modal__content slds-p-around_medium">
                        <lightning-combobox
                            label="Select Status"
                            value={selectedStatus}
                            options={statusOptions}
                            onchange={handleStatusChange}>
                        </lightning-combobox>
                    </div>

                    <footer class="slds-modal__footer">
                        <lightning-button
                            label="Cancel"
                            onclick={closeModal}>
                        </lightning-button>

                        <lightning-button
                            label="Save"
                            variant="brand"
                            onclick={updateStatus}
                            class="slds-m-left_small">
                        </lightning-button>
                    </footer>

                </div>
            </section>

            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>

    </div>

</template>
